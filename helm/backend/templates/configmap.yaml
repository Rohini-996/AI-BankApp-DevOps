apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMap.name }}
  namespace: {{ .Values.namespace }}
data:
  MYSQL_HOST: {{ .Values.configMap.mysqlHost | quote }}
  MYSQL_PORT: {{ .Values.configMap.mysqlPort | quote }}
  MYSQL_DATABASE: {{ .Values.configMap.mysqlDatabase | quote }}
  OLLAMA_URL: {{ .Values.configMap.ollamaUrl | quote }}
  SERVER_FORWARD_HEADERS_STRATEGY: {{ .Values.configMap.serverForwardHeadersStrategy | quote }}
