namespace: bankapp

backend:
  name: bankapp
  replicaCount: 1

  image:
    repository: 330372999470.dkr.ecr.us-east-2.amazonaws.com/ai-bankapp-dev-backend
    tag: 038f7a5
    pullPolicy: Always

  containerPort: 8080

  resources:
   requests:
     cpu: 100m
     memory: 128Mi
   limits:
     cpu: 300m
     memory: 256Mi

service:
  name: bankapp-service
  type: ClusterIP

  port: 8080
  targetPort: 8080

  sessionAffinity: ClientIP
  timeoutSeconds: 3600

configMap:
  name: bankapp-config

  mysqlHost: mysql-service
  mysqlPort: "3306"
  mysqlDatabase: bankapp

  ollamaUrl: "http://ollama-service:11434"

  serverForwardHeadersStrategy: native

secret:
  name: bankapp-secret

mysql:
  serviceName: mysql-service
  port: 3306

ollama:
  serviceName: ollama-service
  port: 11434
