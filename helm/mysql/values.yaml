namespace: bankapp

mysql:
  name: mysql

  image:
    repository: mysql
    tag: "8.0"

  containerPort: 3306

  pvcName: mysql-pvc

  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

secret:
  name: bankapp-secret

service:
  name: mysql-service
  port: 3306
  targetPort: 3306

configMap:
  name: mysql-config

pvc:
  name: mysql-pvc
  accessMode: ReadWriteOnce
  storageClassName: "gp2"
  storage: 2Gi
