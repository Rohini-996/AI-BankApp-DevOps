name: AI-Bankapp CD 

on:
  workflow_run:
    workflows:
      - AI-Bankapp CI
    types:
      - completed 
    branches:
      - main

permissions: 
  contents: read 

jobs:
  deploy-to-kind:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set Image Details
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "tag=${COMMIT_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "repository=$DOCKERHUB_USERNAME/ai-bankapp-devops" >> "$GITHUB_OUTPUT"

      - name: Check Kubernetes Access
        run: |
          kubectl config current-context
          kubectl get nodes
          kubectl get deployment bankapp -n bankapp

      - name: Deploy to Kind
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          kubectl set image deployment/bankapp \
            bankapp="$IMAGE_REPOSITORY:$IMAGE_TAG" \
            -n bankapp

          kubectl rollout status deployment/bankapp \
            -n bankapp \
            --timeout=300s

      - name: Verify Deployment
        run: |
          kubectl get pods -n bankapp
          kubectl get svc -n bankapp
